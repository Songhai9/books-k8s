apiVersion: v1
kind: Service
metadata:
  name: book-notes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "book-notes.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: book-notes
spec:
  type: ClusterIP
  selector:
    {{- include "book-notes.appSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
