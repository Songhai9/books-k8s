apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: book-notes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "book-notes.commonLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: book-notes
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: book-notes
          port: {{ .Values.app.port }}
