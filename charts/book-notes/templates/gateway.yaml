apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: book-notes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "book-notes.commonLabels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listenerPort }}
      allowedRoutes:
        namespaces:
          from: Same
