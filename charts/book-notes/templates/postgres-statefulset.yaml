apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: book-notes-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "book-notes.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      The official PostgreSQL image needs writable runtime paths in addition to the data volume.
    ignore-check.kube-linter.io/run-as-non-root: >-
      The prepare-data-directory init container must run as root to chown the mounted hostPath.
spec:
  serviceName: book-notes-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "book-notes.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "book-notes.postgresSelectorLabels" . | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.postgres.nodeSelector | nindent 8 }}
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: {{ .Values.postgres.initContainer.image }}
          command:
            - sh
            - -ec
            - chown -R 70:70 /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          resources:
            {{- toYaml .Values.postgres.initContainer.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: book-notes-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: book-notes-config
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingDatabaseSecret }}
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/001-schema.sql
              subPath: schema.sql
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: book-notes-schema
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: book-notes
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.postgres.storage.className }}
        selector:
          matchLabels:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/part-of: book-notes
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
