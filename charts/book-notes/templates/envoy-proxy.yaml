apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gateway.envoyProxy.name }}
  namespace: {{ .Values.gateway.envoyProxy.namespace }}
  labels:
    {{- include "book-notes.commonLabels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        pod:
          nodeSelector:
            {{- toYaml .Values.gateway.nodeSelector | nindent 12 }}
        container:
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      envoyService:
        type: NodePort
        externalTrafficPolicy: Local
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: {{ .Values.gateway.listenerPort }}
                  protocol: TCP
                  nodePort: {{ .Values.gateway.nodePort }}
