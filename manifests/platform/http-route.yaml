apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: book-notes
  namespace: book-notes
  labels:
    app.kubernetes.io/part-of: book-notes
spec:
  parentRefs:
    - name: book-notes
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: book-notes
          port: 3000
