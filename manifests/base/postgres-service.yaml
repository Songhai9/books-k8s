apiVersion: v1
kind: Service
metadata:
  name: book-notes-postgres
  namespace: book-notes
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: book-notes
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: book-notes
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
