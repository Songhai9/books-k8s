apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: book-notes-postgres
  namespace: book-notes
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: book-notes
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: >-
      The official PostgreSQL image needs writable runtime paths in addition to the data volume.
    ignore-check.kube-linter.io/run-as-non-root: >-
      The prepare-data-directory init container must run as root to chown the mounted hostPath.
spec:
  serviceName: book-notes-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: book-notes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: book-notes
    spec:
      nodeSelector:
        kubernetes.io/hostname: books-dev-k8s-worker
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-directory
          image: busybox:1.37
          command:
            - sh
            - -ec
            - chown -R 70:70 /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:17.10-alpine3.23
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: book-notes-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: book-notes-config
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: book-notes-database
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/001-schema.sql
              subPath: schema.sql
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: book-notes-schema
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: book-notes
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: book-notes-local
        selector:
          matchLabels:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/part-of: book-notes
        resources:
          requests:
            storage: 5Gi
