name: Kubernetes Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifests:
    name: Scan Kubernetes and Helm misconfigurations
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Block high and critical manifest findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  required:
    name: Required Kubernetes security checks
    if: always()
    needs:
      - secrets
      - manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify all security jobs passed
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          MANIFESTS_RESULT: ${{ needs.manifests.result }}
        run: |
          test "${SECRETS_RESULT}" = "success"
          test "${MANIFESTS_RESULT}" = "success"
